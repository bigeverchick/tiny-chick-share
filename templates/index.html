
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>大叽传输器</title>
</head>

<body style="font-family:sans-serif;padding:40px">

<h2>批量上传图片</h2>

<input type="file" id="file" multiple><br><br>

压缩比例：
<select id="scale">
    <option value="1">不压缩</option>
    <option value="0.5">50%</option>
    <option value="0.3">30%</option>
    <option value="0.1">10%</option>
</select>

<button onclick="upload()">上传图片</button>

<p id="msg"></p>

<progress id="progress" value="0" max="100"
style="width:300px"></progress>

<hr>

<h2>传输文字</h2>

<textarea id="text"
style="width:500px;height:150px"></textarea>

<br><br>

<button onclick="sendText()">发送文字</button>

<button onclick="copyText()">复制到剪贴板</button>

<p id="textmsg"></p>

<script>

async function compress(file, ratio){

    if(ratio == 1) return file;

    let targetSize = file.size * ratio;

    return new Promise(resolve => {

        let img = new Image();
        let reader = new FileReader();

        reader.onload = e => img.src = e.target.result;

        img.onload = () => {

            let canvas = document.createElement("canvas");

            canvas.width = img.width;
            canvas.height = img.height;

            canvas.getContext("2d")
                  .drawImage(img, 0, 0);

            let quality = 0.9;

            function tryCompress(){

                canvas.toBlob(blob => {

                    if(blob.size <= targetSize || quality <= 0.05){

                        resolve(new File(
                            [blob],
                            file.name,
                            {type:"image/jpeg"}
                        ));

                    }else{

                        quality -= 0.05;
                        tryCompress();

                    }

                }, "image/jpeg", quality);
            }

            tryCompress();
        };

        reader.readAsDataURL(file);
    });
}

async function sendFile(file){

    return new Promise(resolve => {

        let form = new FormData();
        form.append("file", file);

        let xhr = new XMLHttpRequest();

        xhr.upload.onprogress = e => {

            if(e.lengthComputable){

                let p = Math.round(
                    e.loaded / e.total * 100
                );

                document.getElementById("progress")
                        .value = p;
            }
        };

        xhr.onload = () => resolve();

        xhr.open("POST", "/upload");
        xhr.send(form);
    });
}

async function upload(){

    let files = document.getElementById("file").files;

    if(files.length == 0){
        alert("请选择图片");
        return;
    }

    let ratio = parseFloat(
        document.getElementById("scale").value
    );

    for(let i = 0; i < files.length; i++){

        let f = files[i];

        document.getElementById("msg")
                .innerText =
                `压缩 ${i+1}/${files.length}`;

        let c = await compress(f, ratio);

        document.getElementById("msg")
                .innerText =
                `上传 ${i+1}/${files.length}`;

        document.getElementById("progress")
                .value = 0;

        await sendFile(c);
    }

    document.getElementById("msg")
            .innerText = "全部上传完成";

    document.getElementById("progress")
            .value = 100;
}

async function sendText(){

    let text = document.getElementById("text").value;

    let form = new FormData();

    form.append("text", text);

    let r = await fetch("/send_text", {
        method: "POST",
        body: form
    });

    document.getElementById("textmsg")
            .innerText = "文字发送成功";
}

async function loadText(){

    let r = await fetch("/get_text");

    let t = await r.text();

    document.getElementById("text").value = t;
}

async function copyText(){

    let text = document.getElementById("text").value;

    try {

        await navigator.clipboard.writeText(text);

        alert("复制成功");

    } catch (err) {

        // 兼容 fallback（非常重要）

        let ta = document.getElementById("text");

        ta.select();

        document.execCommand("copy");

        alert("复制成功");

    }

}
loadText();

</script>

</body>
</html>
